<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>习惯详情</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF7F2}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAF7F2;font-family:'Noto Sans SC','HarmonyOS Sans SC','PingFang SC',system-ui,sans-serif;color:#2B2A27;padding:56px 20px 0;display:flex;flex-direction:column;gap:12px">

<div style="height:44px;display:flex;align-items:center;justify-content:space-between">
<a href="Main.dc.html" aria-label="返回" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 4px 14px rgba(60,50,30,0.08);display:flex;align-items:center;justify-content:center;color:#2B2A27;text-decoration:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin:0;font-size:20px;line-height:28px;font-weight:700">阅读</h1>
<button aria-label="编辑习惯" style="width:44px;height:44px;border:0;border-radius:50%;background:#FFFFFF;box-shadow:0 4px 14px rgba(60,50,30,0.08);display:flex;align-items:center;justify-content:center;padding:0;color:#2B2A27">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"></path></svg>
</button>
</div>

<div style="margin-top:4px;height:128px;box-sizing:border-box;padding:18px 20px;border-radius:24px;background:#FCEBD5;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column">
<span style="font-size:13px;line-height:18px;font-weight:500;color:#55514A">当前连续</span>
<span style="font-family:'Nunito','Noto Sans SC',sans-serif;font-size:60px;line-height:68px;font-weight:800;color:#8A4B0C">12<span style="font-size:18px;font-weight:700;margin-left:4px">天</span></span>
<span style="font-size:13px;line-height:18px;color:#55514A">最长 21 天 · 本月 11 次</span>
</div>
<div style="flex:none;width:72px;height:72px;border-radius:50%;background:#F2A65A;display:flex;align-items:center;justify-content:center">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5A3510" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"></path><path d="M5 19l8-8"></path></svg>
</div>
</div>

<div style="box-sizing:border-box;padding:16px;background:#FFFFFF;border-radius:24px;box-shadow:0 8px 24px rgba(60,50,30,0.06)">
<div style="height:22px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:16px;font-weight:700">本周</span>
<span style="font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#8A4B0C">7 / 7</span>
</div>
<div style="margin-top:10px;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px;justify-items:center">
<sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
<span style="width:40px;height:40px;border-radius:50%;background:#F2A65A;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A3510" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</sc-for>
</div>
<div style="margin-top:4px;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px;height:16px;font-size:12px;line-height:16px;color:#6F6A61;text-align:center">
<span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span style="color:#8A4B0C;font-weight:700">今</span>
</div>
</div>

<div style="box-sizing:border-box;padding:16px;background:#FFFFFF;border-radius:24px;box-shadow:0 8px 24px rgba(60,50,30,0.06)">
<div style="height:22px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:16px;font-weight:700">近 5 周</span>
<span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#6F6A61">
<span style="width:10px;height:10px;border-radius:3px;background:#EEE9DF"></span>未完成
<span style="width:10px;height:10px;border-radius:3px;background:#F2A65A;margin-left:6px"></span>完成
</span>
</div>
<div style="margin-top:10px;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));column-gap:6px;height:16px;font-size:12px;line-height:16px;color:#6F6A61;text-align:center">
<span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
</div>
<div role="img" aria-label="近五周完成情况，共完成30天" style="margin-top:6px;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px">
<sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
<div style="{{ c.style }}"></div>
</sc-for>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px">
<div style="height:76px;box-sizing:border-box;padding:12px 14px;border-radius:20px;background:#FFFFFF;box-shadow:0 6px 18px rgba(60,50,30,0.05);display:flex;flex-direction:column;justify-content:center">
<span style="font-size:12px;line-height:16px;color:#6F6A61">累计</span>
<span style="font-family:'Nunito','Noto Sans SC',sans-serif;font-size:24px;line-height:32px;font-weight:800">126<span style="font-size:13px;font-weight:700;margin-left:2px">次</span></span>
</div>
<div style="height:76px;box-sizing:border-box;padding:12px 14px;border-radius:20px;background:#FFFFFF;box-shadow:0 6px 18px rgba(60,50,30,0.05);display:flex;flex-direction:column;justify-content:center">
<span style="font-size:12px;line-height:16px;color:#6F6A61">近 5 周</span>
<span style="font-family:'Nunito','Noto Sans SC',sans-serif;font-size:24px;line-height:32px;font-weight:800">86%</span>
</div>
<div style="height:76px;box-sizing:border-box;padding:12px 14px;border-radius:20px;background:#FFFFFF;box-shadow:0 6px 18px rgba(60,50,30,0.05);display:flex;flex-direction:column;justify-content:center">
<span style="font-size:12px;line-height:16px;color:#6F6A61">每次平均</span>
<span style="font-family:'Nunito','Noto Sans SC',sans-serif;font-size:24px;line-height:32px;font-weight:800">22<span style="font-size:13px;font-weight:700;margin-left:2px">分钟</span></span>
</div>
</div>

<div style="height:56px;box-sizing:border-box;padding:0 16px;background:#FFFFFF;border-radius:20px;box-shadow:0 6px 18px rgba(60,50,30,0.05);display:flex;align-items:center;gap:12px">
<div style="flex:none;width:32px;height:32px;border-radius:50%;background:#F3EFE7;display:flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6A61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
</div>
<span style="font-size:14px;line-height:20px;font-weight:500">每天 · 20 分钟 · 提醒 21:30</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const missed = [3, 8, 14, 17, 22];
    const cells = [];
    for (let i = 0; i < 35; i++) {
      const done = missed.indexOf(i) === -1;
      const extra = i === 34 ? 'outline:2px solid #8A4B0C;outline-offset:2px;' : '';
      cells.push({ style: 'height:26px;border-radius:8px;background:' + (done ? '#F2A65A' : '#EEE9DF') + ';' + extra });
    }
    const week = [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n }));
    return { cells: cells, week: week };
  }
}
</script>
</body>
</html>
